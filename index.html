<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>探索璀璨星空 - 开启宇宙之旅</title>
    <style>
        /* 基础样式重置 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* 防止出现滚动条 */
            background-color: #000;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            color: #fff;
        }

        /* Canvas 背景容器 */
        #starfield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        /* 导航栏 */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            z-index: 10;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(to right, #fff, #7f7fd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 主体内容区 */
        .container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* 炫酷的介绍卡片 */
        .intro-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px); /* 毛玻璃特效 */
            padding: 50px 80px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            animation: fadeIn 2s ease-out;
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            letter-spacing: 8px;
            animation: slideUp 1.5s ease-out;
        }

        p {
            font-size: 1.2rem;
            line-height: 1.8;
            color: #ccc;
            max-width: 600px;
            margin-bottom: 30px;
        }

        /* 交互按钮 */
        .btn {
            padding: 12px 35px;
            background: transparent;
            color: #fff;
            border: 1px solid #fff;
            border-radius: 30px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 1rem;
            letter-spacing: 2px;
        }

        .btn:hover {
            background: #fff;
            color: #000;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
        }

        /* 动画效果 */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* 适配移动端 */
        @media (max-width: 768px) {
            .intro-card { padding: 30px; width: 80%; }
            h1 { font-size: 2rem; }
            p { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <canvas id="starfield"></canvas>

    <nav>
        <div class="logo">Starry Cosmos</div>
        <div class="menu">
            </div>
    </nav>

    <div class="container">
        <div class="intro-card">
            <h1>璀璨星空</h1>
            <p>
                在浩瀚无垠的宇宙中，每一颗闪烁的星辰都是亿万年前的光芒。
                穿过尘埃与云霭，让我们一起探索那片未知的深邃与寂静。
            </p>
            <a href="#" class="btn">开启探索之旅</a>
        </div>
    </div>

    <script>
        /**
         * 星空特效逻辑
         */
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');

        let width, height, stars = [];
        const starCount = 200; // 星星数量

        // 初始化画布尺寸
        function initCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            
            // 初始化星星
            stars = [];
            for (let i = 0; i < starCount; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 1.5,
                    speed: Math.random() * 0.5 + 0.1,
                    opacity: Math.random()
                });
            }
        }

        // 绘制每一帧
        function draw() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = "#fff";

            stars.forEach(star => {
                ctx.globalAlpha = star.opacity;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();

                // 星星向下缓慢移动
                star.y += star.speed;
                
                // 如果星星滑出屏幕，从顶部重新开始
                if (star.y > height) {
                    star.y = 0;
                    star.x = Math.random() * width;
                }

                // 简单的闪烁效果
                star.opacity += (Math.random() - 0.5) * 0.05;
                if (star.opacity > 1) star.opacity = 1;
                if (star.opacity < 0.2) star.opacity = 0.2;
            });

            requestAnimationFrame(draw);
        }

        // 监听窗口大小改变
        window.addEventListener('resize', initCanvas);

        // 启动
        initCanvas();
        draw();
    </script>
</body>
</html>
